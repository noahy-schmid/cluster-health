version: v2
inputs:
  - directory: proto
plugins:
  # Generates TypeScript-only type definitions (no binary encode/decode runtime)
  # Requires ts-proto to be installed (node_modules/.bin/protoc-gen-ts_proto)
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: src/generated
    opt:
      - onlyTypes=true
      - stringEnums=true
      - snakeToCamel=true
