services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/deinsalon:cached
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/deinsalon
      - JWT_SECRET=devcontainer-secret
      - S3_URL=http://minio:9000
      - S3_REGION=us-east-1
      - S3_SALON_ACCESS_KEY=minioadmin
      - S3_SALON_SECRET_KEY=minioadmin
      - S3_WEBSITE_BUCKET_NAME=salon-media
    init: true
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - deinsalon-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deinsalon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deinsalon-network

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deinsalon-network

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  deinsalon-network:
    driver: bridge