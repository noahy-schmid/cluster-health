version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cluster-health-dev
    volumes:
      # Workspace volume for better performance
      - cluster-health-workspace:/workspaces/cluster-health
      # Bind mount for initial sync
      - ..:/tmp/host-workspace:cached
      # Persistent volumes for user data
      - dev-ssh:/home/node/.ssh
      - dev-zshrc-d:/home/node/.zshrc.d
      - dev-cargo:/home/node/.cargo
      - dev-npm-cache:/home/node/.npm
      - dev-pnpm-cache:/home/node/.local/share/pnpm
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
    init: true
    privileged: true
    # Keep container running
    command: sleep infinity
    # Network setup for future services
    networks:
      - cluster-health-network

  # PostgreSQL database (commented out for now, uncomment when needed)
