[package]
name = "appointment-service"
version = "0.1.0"
edition = "2021"
description = "Appointment & availability domain service for dein.salon"

[[bin]]
name = "appointment-service"
path = "src/main.rs"

[lib]
name = "appointment_service"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# RabbitMQ (AMQP 0-9-1)
lapin = "2"
futures-lite = "2"

# Protobuf runtime (types generated by build.rs via prost-build)
prost = "0.13"

# JSON serialization for RabbitMQ message payloads
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured error types (mirrors the TypeScript thiserror/tagged-error pattern)
thiserror = "2"
anyhow = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Configuration from environment variables
dotenvy = "0.15"

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Async trait support
async-trait = "0.1"

# Datetime handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Container-based integration tests (mirrors the testcontainers pattern used in TS)
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["rabbitmq"] }

[build-dependencies]
# Protobuf code generator — reads .proto files and emits Rust structs at compile time
prost-build = "0.13"
# Vendored protoc binary so no system protoc installation is required
protoc-bin-vendored = "3.0"
