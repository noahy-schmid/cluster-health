name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  determine_environment:
    name: Determine Environment Variables
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      namespace: ${{ steps.env.outputs.namespace }}
      docker_tag: ${{ steps.env.outputs.docker_tag }}
      path_prefix: ${{ steps.env.outputs.path_prefix }}
    steps:
      - name: Determine environment variables
        id: env
        run: |
          # Set environment, namespace, and docker tag based on event type and branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "namespace=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "docker_tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "path_prefix=/pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT
            echo "docker_tag=develop" >> $GITHUB_OUTPUT
            echo "path_prefix=/staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "namespace=production" >> $GITHUB_OUTPUT
            echo "docker_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "path_prefix=/production" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "namespace=development" >> $GITHUB_OUTPUT
            echo "docker_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "path_prefix=/development" >> $GITHUB_OUTPUT
          fi

  build_docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: determine_environment
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ needs.determine_environment.outputs.docker_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./apps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: ./apps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          DOCKER_TAG: ${{ needs.determine_environment.outputs.docker_tag }}
          PATH_PREFIX: ${{ needs.determine_environment.outputs.path_prefix }}
        working-directory: ./apps
        run: |
          pnpm docker:build
          pnpm docker:push

  deploy_to_cluster:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [determine_environment, build_docker]
    environment: ${{ needs.determine_environment.outputs.environment }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./apps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: ./apps

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for DigitalOcean
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.DIGITALOCEAN_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ needs.determine_environment.outputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        working-directory: ./apps
        run: |
          DOCKER_TAG=${{ needs.determine_environment.outputs.docker_tag }}
          NAMESPACE=${{ needs.determine_environment.outputs.namespace }}
          PATH_PREFIX=${{ needs.determine_environment.outputs.path_prefix }}

          pnpm helm:umbrella:dep:update

          pnpm helm:umbrella:lint

          pnpm helm:umbrella:install my-services-${NAMESPACE} ${NAMESPACE} ${DOCKER_TAG} ${PATH_PREFIX}

      - name: Get deployment status
        id: deployment
        run: |
          # Use helm status to get comprehensive deployment information
          helm status my-stylist-frontend --namespace ${{ needs.determine_environment.outputs.namespace }}
          
          # Get ingress URL if available
          INGRESS_IP=$(kubectl get ingress -n ${{ needs.determine_environment.outputs.namespace }} -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "frontend-url=http://${INGRESS_IP}" >> $GITHUB_OUTPUT

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **PR Deployment Complete**
              
              **Environment:** ${{ needs.determine_environment.outputs.environment }}
              **Namespace:** ${{ needs.determine_environment.outputs.namespace }}
              **Docker Tag:** ${{ needs.determine_environment.outputs.docker_tag }}
              **Frontend URL:** ${{ steps.deployment.outputs.frontend-url }}
              
              The application has been deployed using Helm to namespace \`${{ needs.determine_environment.outputs.namespace }}\`.
              
              **Commands to check deployment:**
              \`\`\`bash
              kubectl get pods -n ${{ needs.determine_environment.outputs.namespace }}
              kubectl get service -n ${{ needs.determine_environment.outputs.namespace }}
              kubectl get ingress -n ${{ needs.determine_environment.outputs.namespace }}
              \`\`\`
              
              **Clean up:** Run \`helm uninstall my-stylist-frontend -n ${{ needs.determine_environment.outputs.namespace }}\` after merging.`
            })

