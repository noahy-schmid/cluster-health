name: Coolify PR Cleanup

on:
  pull_request:
    types: [closed]

env:
  PNPM_VERSION: 10.17.1

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete PR environment from Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: pnpm --filter @repo/deployment run cleanup-pr -- --pr-number ${{ github.event.pull_request.number }}
