name: Database Migration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"

env:
  PNPM_VERSION: 10.17.1

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain packages
        run: |
          pnpm --filter @repo/auth-domain build
          pnpm --filter @repo/salon-domain build
          pnpm --filter @repo/website-domain build

      - name: Set deployment environment
        id: deployment
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "DOKPLOY_DEPLOY_URL=https://pr-${{ github.event.pull_request.number }}-app.example.com" >> $GITHUB_ENV
            echo "NODE_ENV=development" >> $GITHUB_ENV
            echo "env=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "NODE_ENV=development" >> $GITHUB_ENV
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - name: Run database migrations
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_DATABASE: ${{ secrets.DATABASE_DATABASE }}
          NODE_ENV: ${{ env.NODE_ENV }}
          DOKPLOY_DEPLOY_URL: ${{ env.DOKPLOY_DEPLOY_URL }}
        run: pnpm db:migrate

      - name: Migration summary
        if: always()
        run: |
          {
            echo "## Database Migration Summary"
            echo ""
            echo "- **Environment**: ${{ steps.deployment.outputs.env }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- **PR Number**: #${{ github.event.pull_request.number }}"
              echo "- **Database**: pr_${{ github.event.pull_request.number }}"
            fi
            echo ""
            echo "Database migrations completed successfully"
          } >> "$GITHUB_STEP_SUMMARY"
