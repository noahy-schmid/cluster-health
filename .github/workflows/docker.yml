name: Docker Build and Push

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app:
          - name: manage-salon-webpage
            context: .
            dockerfile: apps/manage-salon-webpage/Dockerfile
          - name: salon-webpage
            context: .
            dockerfile: apps/salon-webpage/Dockerfile
          - name: marketing-webpage
            context: .
            dockerfile: apps/marketing-webpage/Dockerfile
          - name: calendar-service
            context: apps/calendar-service
            dockerfile: apps/calendar-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,prefix={{branch}}-

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag=develop" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app.name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy PR environment to Coolify (development)
        if: github.event_name == 'pull_request'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVER_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
          COOLIFY_DEVELOPMENT_PROJECT_UUID: ${{ secrets.COOLIFY_DEVELOPMENT_PROJECT_UUID }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # app name → exposed port inside the container
          declare -A APP_PORTS=(
            ["manage-salon-webpage"]="3000"
            ["salon-webpage"]="3000"
            ["marketing-webpage"]="3000"
            ["calendar-service"]="8080"
          )

          IMAGE_TAG="pr-${PR_NUMBER}"

          # Fetch the full application list once to avoid repeated API calls
          ALL_APPS=$(curl -sf \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications" || echo "[]")

          for APP_NAME in "${!APP_PORTS[@]}"; do
            APP_PORT="${APP_PORTS[$APP_NAME]}"
            SERVICE_NAME="pr-${PR_NUMBER}-${APP_NAME}"
            IMAGE_NAME="ghcr.io/${IMAGE_OWNER}/${APP_NAME}"

            echo "Processing ${SERVICE_NAME}..."

            # Look up an existing application by name in the cached list
            EXISTING_UUID=$(echo "${ALL_APPS}" | \
              jq -r --arg n "${SERVICE_NAME}" '.[] | select(.name == $n) | .uuid // empty')

            if [ -z "${EXISTING_UUID}" ]; then
              echo "  Creating new Coolify application: ${SERVICE_NAME}"
              RESULT=$(curl -sf -X POST \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                -H "Content-Type: application/json" \
                "${COOLIFY_URL}/api/v1/applications" \
                -d "{
                  \"type\": \"dockerimage\",
                  \"name\": \"${SERVICE_NAME}\",
                  \"project_uuid\": \"${COOLIFY_DEVELOPMENT_PROJECT_UUID}\",
                  \"server_uuid\": \"${COOLIFY_SERVER_UUID}\",
                  \"environment_name\": \"pr-${PR_NUMBER}\",
                  \"docker_registry_image_name\": \"${IMAGE_NAME}\",
                  \"docker_registry_image_tag\": \"${IMAGE_TAG}\",
                  \"ports_exposes\": \"${APP_PORT}\"
                }" || true)
              APP_UUID=$(echo "${RESULT}" | jq -r '.uuid // empty')
              echo "  Created with UUID: ${APP_UUID}"
            else
              APP_UUID="${EXISTING_UUID}"
              echo "  Found existing application (${APP_UUID})"
            fi

            if [ -n "${APP_UUID}" ]; then
              echo "  Deploying ${SERVICE_NAME}..."
              curl -sf -X POST \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                "${COOLIFY_URL}/api/v1/applications/${APP_UUID}/deploy" || true
              echo "  Deployment triggered for ${SERVICE_NAME}"
            else
              echo "  WARNING: Could not obtain UUID for ${SERVICE_NAME}, skipping deploy"
            fi
          done

      - name: Deploy to Coolify staging (develop branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID_MANAGE: ${{ secrets.COOLIFY_STAGING_MANAGE_SALON_UUID }}
          UUID_SALON: ${{ secrets.COOLIFY_STAGING_SALON_UUID }}
          UUID_MARKETING: ${{ secrets.COOLIFY_STAGING_MARKETING_UUID }}
          UUID_CALENDAR: ${{ secrets.COOLIFY_STAGING_CALENDAR_UUID }}
        run: |
          for UUID in "${UUID_MANAGE}" "${UUID_SALON}" "${UUID_MARKETING}" "${UUID_CALENDAR}"; do
            if [ -n "${UUID}" ]; then
              echo "Triggering staging deployment for ${UUID}..."
              curl -sf -X POST \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                "${COOLIFY_URL}/api/v1/applications/${UUID}/deploy" || true
            fi
          done

      - name: Deploy to Coolify production (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID_MANAGE: ${{ secrets.COOLIFY_PRODUCTION_MANAGE_SALON_UUID }}
          UUID_SALON: ${{ secrets.COOLIFY_PRODUCTION_SALON_UUID }}
          UUID_MARKETING: ${{ secrets.COOLIFY_PRODUCTION_MARKETING_UUID }}
          UUID_CALENDAR: ${{ secrets.COOLIFY_PRODUCTION_CALENDAR_UUID }}
        run: |
          for UUID in "${UUID_MANAGE}" "${UUID_SALON}" "${UUID_MARKETING}" "${UUID_CALENDAR}"; do
            if [ -n "${UUID}" ]; then
              echo "Triggering production deployment for ${UUID}..."
              curl -sf -X POST \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                "${COOLIFY_URL}/api/v1/applications/${UUID}/deploy" || true
            fi
          done
