name: Docker Build and Push

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - develop

env:
  PNPM_VERSION: 10.17.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app:
          - name: manage-salon-webpage
            context: .
            dockerfile: apps/manage-salon-webpage/Dockerfile
          - name: salon-webpage
            context: .
            dockerfile: apps/salon-webpage/Dockerfile
          - name: marketing-webpage
            context: .
            dockerfile: apps/marketing-webpage/Dockerfile
          - name: calendar-service
            context: apps/calendar-service
            dockerfile: apps/calendar-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,prefix={{branch}}-

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag=develop" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app.name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy PR environment to Coolify (development)
        if: github.event_name == 'pull_request'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVER_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
          COOLIFY_DEVELOPMENT_PROJECT_UUID: ${{ secrets.COOLIFY_DEVELOPMENT_PROJECT_UUID }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: pnpm --filter @repo/deployment run deploy-pr -- --pr-number ${{ github.event.pull_request.number }}

      - name: Deploy to Coolify staging (develop branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_STAGING_MANAGE_SALON_UUID: ${{ secrets.COOLIFY_STAGING_MANAGE_SALON_UUID }}
          COOLIFY_STAGING_SALON_UUID: ${{ secrets.COOLIFY_STAGING_SALON_UUID }}
          COOLIFY_STAGING_MARKETING_UUID: ${{ secrets.COOLIFY_STAGING_MARKETING_UUID }}
          COOLIFY_STAGING_CALENDAR_UUID: ${{ secrets.COOLIFY_STAGING_CALENDAR_UUID }}
        run: pnpm --filter @repo/deployment run deploy-staging

      - name: Deploy to Coolify production (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PRODUCTION_MANAGE_SALON_UUID: ${{ secrets.COOLIFY_PRODUCTION_MANAGE_SALON_UUID }}
          COOLIFY_PRODUCTION_SALON_UUID: ${{ secrets.COOLIFY_PRODUCTION_SALON_UUID }}
          COOLIFY_PRODUCTION_MARKETING_UUID: ${{ secrets.COOLIFY_PRODUCTION_MARKETING_UUID }}
          COOLIFY_PRODUCTION_CALENDAR_UUID: ${{ secrets.COOLIFY_PRODUCTION_CALENDAR_UUID }}
        run: pnpm --filter @repo/deployment run deploy-production
